<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>پنل مدیریت — Glow Home Decor</title>
<style>
  :root {
    --bg: #f5f0e6;
    --surface: #fffdf9;
    --ink: #221a14;
    --tan: #b49578;
    --tan-dark: #a47e5b;
    --divider: #e4dccd;
    --danger: #b3432f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Tahoma, sans-serif;
    background: var(--bg);
    color: var(--ink);
    direction: rtl;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 28px 20px 80px; }
  h1 { font-size: 22px; font-weight: 700; margin: 0 0 6px; }
  .sub { color: #6b5f52; font-size: 14px; margin-bottom: 28px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--divider);
    border-radius: 14px;
    padding: 22px;
    margin-bottom: 22px;
  }

  label { display: block; font-size: 13px; margin-bottom: 5px; color: #4a4038; }
  input, select, textarea {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--divider);
    border-radius: 9px;
    background: #fff;
    font-size: 14px;
    font-family: inherit;
    color: var(--ink);
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--tan); outline-offset: 1px; }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 18px;
    border-radius: 999px;
    border: 0;
    background: var(--tan);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn:hover { background: var(--tan-dark); }
  .btn.ghost { background: none; border: 1px solid var(--divider); color: var(--ink); }
  .btn.danger { background: var(--danger); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .row > * { flex: 1; min-width: 140px; }

  #login-view { max-width: 380px; margin: 60px auto; }
  #login-view .card { text-align: center; }
  #login-view input { margin-bottom: 12px; }
  .toggle-link { font-size: 13px; color: var(--tan-dark); cursor: pointer; text-decoration: underline; margin-top: 10px; display: inline-block; }
  .msg { font-size: 13px; margin-top: 10px; min-height: 18px; }
  .msg.error { color: var(--danger); }
  .msg.ok { color: #3a7d3a; }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { text-align: right; padding: 8px 6px; border-bottom: 1px solid var(--divider); vertical-align: middle; }
  th { font-weight: 700; color: #4a4038; font-size: 12.5px; }
  td input, td select { padding: 5px 8px; font-size: 13px; }
  td.narrow { width: 70px; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; }
  .checkbox-cell { text-align: center; }
  .checkbox-cell input { width: auto; }

  .tabs { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid var(--divider); }
  .tab-btn {
    padding: 10px 18px;
    border: 0;
    background: none;
    font-size: 14px;
    font-weight: 600;
    color: #8a7d6e;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .tab-btn.active { color: var(--tan-dark); border-bottom-color: var(--tan-dark); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .edit-row td { background: #fbf8f2; padding: 16px; }
  .edit-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .edit-grid.wide { grid-template-columns: 1fr; }
  .edit-grid label { margin-top: 4px; }
  .variant-row { display: flex; gap: 8px; margin-bottom: 6px; align-items: center; }
  .variant-row input { width: auto; flex: 1; }
  .variant-row button { flex: 0 0 auto; padding: 5px 10px; }
  .link-btn { background: none; border: 0; color: var(--tan-dark); text-decoration: underline; cursor: pointer; font-size: 13px; padding: 4px 0; }
  .order-card { border: 1px solid var(--divider); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  .order-head { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 10px; }
  .order-items { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--divider); font-size: 13.5px; }
  .order-item-row { display: flex; justify-content: space-between; padding: 3px 0; }
  .status-pill {
    display: inline-block;
    padding: 3px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
  }
  .status-pending { background: #f3e3c8; color: #8a5a1f; }
  .status-paid { background: #d7ecd9; color: #2c6b32; }
  .status-preparing { background: #e6d9f0; color: #5a3a8a; }
  .status-shipped { background: #d6e6f5; color: #245a8a; }
  .status-delivered { background: #cdebe2; color: #1f6e57; }
  .status-cancelled { background: #f3d6d3; color: #a3372a; }

  #app-view { display: none; }
  #not-admin-view { display: none; text-align: center; padding: 60px 20px; }
</style>
</head>
<body>

<div id="login-view" class="wrap">
  <h1 style="text-align:center">ورود مدیر</h1>
  <div class="card">
    <input id="email" type="email" placeholder="ایمیل" autocomplete="username">
    <input id="password" type="password" placeholder="رمز عبور" autocomplete="current-password">
    <button class="btn" id="btn-signin" style="width:100%; justify-content:center">ورود</button>
    <div id="login-msg" class="msg"></div>
    <span class="toggle-link" id="toggle-signup">حساب ندارید؟ ثبت‌نام کنید</span>
  </div>
</div>

<div id="not-admin-view" class="wrap">
  <h1>دسترسی محدود است</h1>
  <p>این حساب دسترسی مدیریتی ندارد. اگر فکر می‌کنید اشتباه است، با توسعه‌دهنده تماس بگیرید.</p>
  <button class="btn ghost" id="btn-signout-2">خروج</button>
</div>

<div id="app-view" class="wrap">
  <div class="top-bar">
    <div>
      <h1>پنل مدیریت</h1>
      <div class="sub">Glow Home Decor</div>
    </div>
    <button class="btn ghost" id="btn-signout">خروج</button>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="products">محصولات</button>
    <button class="tab-btn" data-tab="orders">سفارش‌ها</button>
  </div>

  <div id="tab-products" class="tab-panel active">
    <div class="card">
      <h2 style="margin-top:0; font-size:16px">افزودن محصول جدید</h2>
      <div class="row">
        <div><label>Slug (انگلیسی، یکتا)</label><input id="new-slug" placeholder="e.g. lale"></div>
        <div><label>نام فارسی</label><input id="new-name-fa"></div>
        <div><label>نام انگلیسی</label><input id="new-name-en"></div>
      </div>
      <div class="row" style="margin-top:10px">
        <div>
          <label>دسته</label>
          <select id="new-collection">
            <option value="lamps">آباژور</option>
            <option value="shades">شید</option>
            <option value="candles">شمع</option>
            <option value="decor">اکسسوری منزل</option>
          </select>
        </div>
        <div><label>زیردسته (جنس بدنه، اختیاری)</label><input id="new-subcategory" placeholder="e.g. سفالی"></div>
        <div>
          <label>محل قرارگیری (اختیاری)</label>
          <select id="new-style">
            <option value="">—</option>
            <option value="رومیزی">رومیزی</option>
            <option value="کنار سالنی">کنار سالنی</option>
          </select>
        </div>
      </div>
      <div class="row" style="margin-top:10px">
        <div><label>جنس</label><input id="new-material"></div>
        <div><label>ارتفاع (سانتی‌متر، اختیاری)</label><input id="new-height" type="number"></div>
        <div><label>قیمت (تومان)</label><input id="new-price" type="number"></div>
      </div>
      <div class="row" style="margin-top:10px">
        <div style="flex:2"><label>آدرس عکس (images/xxx.jpg)</label><input id="new-photo"></div>
        <div style="flex:3"><label>توضیحات</label><input id="new-desc"></div>
      </div>
      <div style="margin-top:14px">
        <button class="btn" id="btn-add">افزودن محصول</button>
        <span id="add-msg" class="msg" style="display:inline-block"></span>
      </div>
    </div>

    <div class="card">
      <h2 style="margin-top:0; font-size:16px">محصولات موجود</h2>
      <div style="overflow-x:auto">
        <table id="products-table">
          <thead>
            <tr>
              <th>نام</th>
              <th>دسته</th>
              <th>قیمت</th>
              <th class="checkbox-cell">قیمت موقت</th>
              <th class="checkbox-cell">موجود</th>
              <th class="narrow"></th>
              <th class="narrow"></th>
            </tr>
          </thead>
          <tbody id="products-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="tab-orders" class="tab-panel">
    <div class="card">
      <h2 style="margin-top:0; font-size:16px">سفارش‌ها</h2>
      <div id="orders-list">در حال بارگذاری...</div>
    </div>
  </div>
</div>

<script src="/vendor/supabase.js"></script>
<script src="/supabase-config.js"></script>
<script src="/admin/admin.js"></script>
</body>
</html>
